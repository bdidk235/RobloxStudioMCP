[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-studio-mcp"
version = "0.1.0"
description = "A lightweight, dependency-free Python client for MCP (Model Context Protocol) servers, with built-in convenience for the Roblox Studio MCP."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "roblox", "roblox-studio", "json-rpc", "stdio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-xdist>=3.5"]

[tool.pytest.ini_options]
# The suite is dominated by real waits in subprocess-backed timing tests, and
# the slowest 12 accounted for ~19s of a ~35s run. Measured 2026-10-03: -n 4 on
# an 8-core box gives 18.3/18.2/15.1s across three runs, same 720 passed, and -n 8
# was no better than -n 4, so the lower figure leaves headroom. Override with
# `-n 0` to serialise when debugging a single test.
addopts = "-n 4"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roblox_studio_mcp = ["py.typed"]
