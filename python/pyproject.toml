[build-system]
# setuptools>=77 is the floor for the two things this file now relies on:
# `license` as an SPDX string and `license-files` (PEP 639). Both are named as
# "available on setuptools>=77.0.0" in setuptools' own deprecation warning for
# the old table form, which is the form this used. A lower pin still builds, but
# it resolves the string against the table-only reader and the license metadata
# comes out wrong rather than loud.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-studio-mcp"
version = "0.1.0"
description = "A lightweight, dependency-free Python client for MCP (Model Context Protocol) servers, with built-in convenience for the Roblox Studio MCP."
readme = "README.md"
requires-python = ">=3.9"
# SPDX expression, not `license = { text = "MIT" }`. The table form is deprecated
# (setuptools warns on every build) and is removed on 2027-Feb-18.
license = "MIT"
# `LICENSE` lives one directory up, at the repo root, and setuptools globs
# `license-files` relative to *this* file. `["../LICENSE"]` does put the file in
# the wheel, but it also warns "Pattern '../LICENSE' cannot contain '..'" and
# that becomes a hard failure on the same 2027 date. So the license text is
# carried here as a byte-identical copy, pinned by tests/test_packaging.py.
license-files = ["LICENSE"]
authors = [
    { name = "bdidk235", email = "53656028+bdidk235@users.noreply.github.com" },
]
keywords = ["mcp", "model-context-protocol", "roblox", "roblox-studio", "json-rpc", "stdio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/bdidk235/RobloxStudioMCP"
Repository = "https://github.com/bdidk235/RobloxStudioMCP"
Issues = "https://github.com/bdidk235/RobloxStudioMCP/issues"
Documentation = "https://github.com/bdidk235/RobloxStudioMCP#readme"

# `python -m roblox_studio_mcp.extended_server` still works; this is the same
# entry point under a name that can be typed.
[project.scripts]
roblox-studio-mcp = "roblox_studio_mcp.extended_server:main"

[project.optional-dependencies]
# setuptools is *listed*, not assumed. The nine wheel tests in
# python/tests/test_packaging.py guard on `importlib.util.find_spec("setuptools")`
# and skip whole classes when it is absent - silently, because a setUpClass
# SkipTest is a skip and not a failure. Python stopped bundling setuptools into
# new venvs at 3.12, so on a bare 3.12 venv nine licence, wheel-content and
# console-script checks do not run at all and the suite still exits 0. Measured
# 2026-10-09: 3.12.15 with setuptools 859 passed / 7 skipped, the same as
# 3.9-3.11; without it 849 passed / 17 skipped, and the 10 extra skips are every
# assertion that reads the built wheel.
# `wheel` and the setuptools floor are both load-bearing, for the same CI
# failure: fresh runners resolved `bdist_wheel` to nothing -
# `error: invalid command 'bdist_wheel'` on all 8 legs - because the test
# builds wheels in-process with the *runtime* setuptools, which is whatever
# the runner image ships, while `requires` above only floors the *build*
# environment. `setuptools>=77` forces the runtime up to the same floor this
# file already demands for the build (license string + license-files need
# it); `wheel` registers `bdist_wheel` through distutils entry points
# (verified present in wheel 0.48.0), which covers any setuptools that
# consults them but ships no local module. Modern setuptools ignores the
# package for this purpose ("never loaded from wheel"), so it is inert
# where it is not needed.
dev = ["pytest", "pytest-asyncio", "pytest-xdist>=3.5", "pyright", "setuptools>=77", "ty==0.0.85", "wheel"]

[tool.pytest.ini_options]
# The suite is dominated by real waits in subprocess-backed timing tests, and
# the slowest 12 accounted for ~19s of a ~35s run. Measured 2026-10-03: -n 4 on
# an 8-core box gives 18.3/18.2/15.1s across three runs with an unchanged pass
# count, and -n 8 was no better than -n 4, so the lower figure leaves headroom.
# Override with `-n 0` to serialise when debugging a single test.
addopts = "-n 4"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Data, not modules: `skills/` has no __init__.py, so this glob is the only
# thing that puts it in the wheel. It is not decoration - the wheel built
# without it carried all 24 modules and none of the 8 skill files, and
# `extended_skill` served an empty catalogue with no error. See
# tests/test_skills.py::TestPackaging, which builds a wheel and reads its
# listing, so this line cannot silently lapse again.
roblox_studio_mcp = ["py.typed", "skills/*.md"]

[tool.ty]
# One scoped exemption, not a suppressed rule. `os.startfile` exists only on
# Windows: the ignore comment on the startfile call suppresses a real
# diagnostic on POSIX and is therefore unused on Windows, where ty reports
# the unused ignore itself (CI proved the Windows half). Exempting the rule
# for platform.py alone keeps it live everywhere else, so a stale suppression
# anywhere else still fails the gate.
[[tool.ty.overrides]]
include = ["src/roblox_studio_mcp/extended/platform.py"]

[tool.ty.overrides.rules]
unused-ignore-comment = "ignore"
