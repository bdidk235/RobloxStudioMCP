name: CI

on:
  push:
  pull_request:

# One job: Python unit tests on Windows and macOS.
# No Studio needed anywhere here (fakes throughout). Live-Studio
# integration (wait_for_studio + test_integration_studio) runs locally
# with ROBLOX_STUDIO_MCP_INTEGRATION=1 — see the repo README.

jobs:
  python-test:
    name: Python tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        # `requires-python = ">=3.9"` is a claim about four versions, so all four
        # are exercised. Counts are deliberately absent here: suite numbers
        # drift with every change, and a figure in a comment is stale the
        # moment it lands — TODO.md re-measures on demand instead. What does
        # not drift: without setuptools importable, a 3.12 venv (which no
        # longer bundles setuptools) skips the nine wheel-content tests
        # silently, which is why `[dev]` names it explicitly. The remaining
        # skips are pyright-gated tests, the live-Studio integration test
        # (local-only by construction), and the docs index.
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install client (with dev extras)
        run: pip install -e ".[dev]"

      - name: Python tests
        # The type gate defaults to ty locally (fast); CI pins pyright, because
        # ty is 0.0.x and its diagnostics may move between releases.
        env:
          ROBLOX_TYPECHECKER: pyright
        run: python -m pytest tests

      - name: Type gate (ty backend)
        # Both backends are proven on every push: the fast default must also be
        # green, or a ty-only regression surfaces on the next local run instead
        # of here. ty is pinned in `[dev]` for exactly this step - an unpinned
        # 0.0.x checker could turn this red with no code change on our side.
        env:
          ROBLOX_TYPECHECKER: ty
        run: python -m pytest tests/test_typecheck.py
