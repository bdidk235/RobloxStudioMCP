name: CI

on:
  push:
  pull_request:

# One job: Python unit tests on Windows and macOS.
# No Studio needed anywhere here (fakes throughout). Live-Studio
# integration (wait_for_studio + test_integration_studio) runs locally
# with ROBLOX_STUDIO_MCP_INTEGRATION=1 — see the repo README.

jobs:
  python-test:
    name: Python tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        # `requires-python = ">=3.9"` is a claim about four versions, so all four
        # are exercised. Measured 2026-10-09 here on cpython 3.9.25 / 3.10.22 /
        # 3.11.17 / 3.12.15: **859 passed, 7 skipped, 233 subtests, identical on
        # all four** - but only with setuptools importable, which is why `[dev]`
        # names it explicitly. Without it a 3.12 venv (which no longer bundles
        # setuptools) skips the nine wheel-content tests silently and reports
        # 849 passed / 17 skipped. pyright is the other 5 skips; the remaining
        # two are the live-Studio integration test and the docs index.
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install client (with dev extras)
        run: pip install -e ".[dev]"

      - name: Python tests
        # The type gate defaults to ty locally (fast); CI pins pyright, because
        # ty is 0.0.x and its diagnostics may move between releases.
        env:
          ROBLOX_TYPECHECKER: pyright
        run: python -m pytest tests
