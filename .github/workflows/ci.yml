name: CI

on:
  push:
  pull_request:

# Two jobs: unit tests per language on Windows and macOS.
# No Studio needed anywhere here (fakes throughout). Live-Studio
# integration (wait_for_studio + test_integration_studio) runs locally
# with ROBLOX_STUDIO_MCP_INTEGRATION=1 — see the repo README.

jobs:
  python-test:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install client (with dev extras)
        run: pip install -e ".[dev]"

      - name: Python tests
        run: python -m pytest tests

  node-test:
    name: Node tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install -g pnpm@10

      - name: Install Node deps
        run: pnpm --dir node install --frozen-lockfile

      - name: Node typecheck
        run: pnpm --dir node typecheck

      - name: Node tests
        run: pnpm --dir node test

      - name: Node build
        run: pnpm --dir node build
