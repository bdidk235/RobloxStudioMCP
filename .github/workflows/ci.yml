name: CI

on:
  push:
  pull_request:

# One job: Python unit tests on Windows and macOS.
# No Studio needed anywhere here (fakes throughout). Live-Studio
# integration (wait_for_studio + test_integration_studio) runs locally
# with ROBLOX_STUDIO_MCP_INTEGRATION=1 — see the repo README.

jobs:
  python-test:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install client (with dev extras)
        run: pip install -e ".[dev]"

      - name: Python tests
        run: python -m pytest tests
