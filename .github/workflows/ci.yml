name: CI

on:
  push:
  pull_request:

# Four jobs: unit tests per language (no Studio needed), plus live
# integration per language against a real Studio with MCP enabled.
#
# The *-studio jobs need a ROBLOSECURITY secret (a burner account is
# recommended) stored as a Repository secret, for an account that has
# "Enable Studio as MCP server" turned on (Assistant -> Manage MCP Servers;
# the setting roams with the account, so enabling it once on any machine
# covers CI). Job-level `if:` cannot see secrets, so each studio job checks
# for the secret in its first step and skips the rest gracefully when absent.

jobs:
  python-test:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install client (with dev extras)
        run: pip install -e ".[dev]"

      - name: Python tests
        run: python -m pytest tests

  node-test:
    name: Node tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install -g pnpm@10

      - name: Install Node deps
        run: pnpm --dir node install --frozen-lockfile

      - name: Node typecheck
        run: pnpm --dir node typecheck

      - name: Node tests
        run: pnpm --dir node test

      - name: Node build
        run: pnpm --dir node build

  python-studio:
    name: Python + Studio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    environment: ROBLOSECURITY
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Check for ROBLOSECURITY secret
        id: check
        shell: bash
        run: |
          if [ -z "${{ secrets.ROBLOSECURITY }}" ]; then
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Studio tests need a ROBLOSECURITY secret — skipping
        if: steps.check.outputs.has_secret != 'true'
        run: |
          echo "Add a ROBLOSECURITY Repository secret for an account with Studio MCP enabled, then rerun."

      - name: Set up Python
        if: steps.check.outputs.has_secret == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install client (with dev extras)
        if: steps.check.outputs.has_secret == 'true'
        run: pip install -e "./python[dev]"

      - name: Resolve Studio version (Windows)
        if: steps.check.outputs.has_secret == 'true' && runner.os == 'Windows'
        id: studio-version
        run: |
          $ver = (Invoke-RestMethod -Uri "https://clientsettingscdn.roblox.com/v2/client-version/WindowsStudio64").clientVersionUpload
          if (-not $ver) { throw "Could not resolve Studio version" }
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Restore cached Studio (Windows)
        if: steps.check.outputs.has_secret == 'true' && runner.os == 'Windows'
        id: cache-studio
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Roblox\Versions
          key: studio-windows-${{ steps.studio-version.outputs.version }}
          restore-keys: |
            studio-windows-

      - name: Install Roblox Studio (Windows)
        if: steps.check.outputs.has_secret == 'true' && runner.os == 'Windows'
        timeout-minutes: 5
        run: |
          # Single-file download + unzip beats the bootstrapper (dozens of
          # packages). Skipped entirely on an exact cache hit.
          $version = "${{ steps.studio-version.outputs.version }}"
          $dest = Join-Path $env:LOCALAPPDATA "Roblox\Versions\$version"
          $exe = Join-Path $dest "RobloxStudioBeta.exe"
          if (-not (Test-Path $exe)) {
            $zip = Join-Path $env:TEMP "RobloxStudio.zip"
            curl.exe -L --fail --retry 3 -o $zip "https://setup.rbxcdn.com/$version-RobloxStudio.zip"
            New-Item -Path $dest -ItemType Directory -Force | Out-Null
            Expand-Archive -Path $zip -DestinationPath $dest -Force
            Remove-Item -Path $zip -Force
          }
          if (-not (Test-Path $exe)) { throw "RobloxStudioBeta.exe not found after install" }
          # The zip skips the bootstrapper, which normally lays down mcp.bat
          # (a forwarder to Versions\<version>\StudioMCP.exe); recreate its
          # equivalent so the default proxy launch works.
          $proxy = Join-Path $dest "StudioMCP.exe"
          if (-not (Test-Path $proxy)) { throw "StudioMCP.exe not found after install" }
          Set-Content -Path (Join-Path $env:LOCALAPPDATA "Roblox\mcp.bat") -Value "@echo off`r`n`"$proxy`" %*`r`n" -Encoding ascii

      - name: Install Roblox Studio (macOS)
        if: steps.check.outputs.has_secret == 'true' && runner.os == 'macOS'
        run: |
          # Direct download from Roblox's own CDN:
          # mount the dmg, copy out the installer app, run it, clean up.
          set -euo pipefail
          dmg="/tmp/RobloxStudio-$(openssl rand -hex 4).dmg"
          curl -L --fail --retry 3 -o "$dmg" "https://setup.rbxcdn.com/mac/RobloxStudio.dmg"
          # Strip quarantine so Gatekeeper doesn't stall first launch.
          xattr -d com.apple.quarantine "$dmg" 2>/dev/null || true
          mnt="/tmp/rbx-studio-mnt"
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mnt"
          app="$(find "$mnt" -maxdepth 1 -name '*.app' -type d -print -quit)"
          if [ -z "$app" ]; then echo "No .app found in $dmg"; hdiutil detach "$mnt" || true; exit 1; fi
          cp -R "$app" /Applications/
          xattr -dr com.apple.quarantine "/Applications/$(basename "$app")" || true
          hdiutil detach "$mnt"
          rm -f "$dmg"
          open -W "/Applications/$(basename "$app")"

      - name: First-run init (Windows)
        if: steps.check.outputs.has_secret == 'true' && runner.os == 'Windows'
        run: |
          # Let Studio create its profile dirs, then kill it; the MCP flag
          # is seeded after, so first-run setup can't wipe it.
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions" -Directory |
            ForEach-Object { Join-Path $_.FullName "RobloxStudioBeta.exe" } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "RobloxStudioBeta.exe not found after install" }
          Start-Process -FilePath $exe
          Start-Sleep -Seconds 30
          Stop-Process -Name "RobloxStudioBeta" -ErrorAction SilentlyContinue

      - name: Seed auth and MCP flag (Windows)
        if: steps.check.outputs.has_secret == 'true' && runner.os == 'Windows'
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
        run: |
          # Resolve the account's user ID from the cookie.
          $me = Invoke-RestMethod -Uri "https://users.roblox.com/v1/users/authenticated" -Headers @{ Cookie = ".ROBLOSECURITY=$env:ROBLOSECURITY" }
          # Seed every credential store Studio reads (wincreds primary with
          # the exact target names it uses, registry legacy) so it opens
          # logged in.
          cmdkey /add:"https://www.roblox.com:RobloxStudioAuthuserid" /user:"$($me.id)" /pass:"$($me.id)"
          cmdkey /add:"https://www.roblox.com:RobloxStudioAuth.ROBLOSECURITY$($me.id)" /user:"$($me.id)" /pass:"$env:ROBLOSECURITY"
          cmdkey /add:"https://www.roblox.com:RobloxStudioAuth.ROBLOSECURITY" /user:"$($me.id)" /pass:"$env:ROBLOSECURITY"
          $reg = "HKCU:\Software\Roblox\RobloxStudioBrowser\roblox.com"
          New-Item -Path $reg -Force | Out-Null
          New-ItemProperty -Path $reg -Name ".ROBLOSECURITY" -Value $env:ROBLOSECURITY -PropertyType String -Force | Out-Null
          # Write the Assistant plugin setting so Studio starts with MCP enabled.
          $dir = Join-Path $env:LOCALAPPDATA "Roblox\$($me.id)\InstalledPlugins\0"
          New-Item -Path $dir -ItemType Directory -Force | Out-Null
          Set-Content -Path (Join-Path $dir "settings.json") -Value '{ "Assistant-ExternalMCPEnabled":true }' -Encoding utf8NoBOM

      - name: Launch Studio (Windows)
        if: steps.check.outputs.has_secret == 'true' && runner.os == 'Windows'
        run: |
          # Auth already seeded above; locate the installed Studio.
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions" -Directory |
            ForEach-Object { Join-Path $_.FullName "RobloxStudioBeta.exe" } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "RobloxStudioBeta.exe not found after install" }
          # Drop any Studio the installer may have auto-launched, so the
          # edit-mode instance below is the one MCP attaches to.
          Stop-Process -Name "RobloxStudioBeta" -ErrorAction SilentlyContinue
          # Open this place in edit mode (minimized protocol URL; the CI
          # account needs edit access to it, or swap in your own IDs).
          Start-Process -FilePath $exe -ArgumentList "roblox-studio:1+launchmode:edit+task:EditPlace+placeId:95206881+universeId:28220420"

      - name: First-run init (macOS)
        if: steps.check.outputs.has_secret == 'true' && runner.os == 'macOS'
        run: |
          # Let Studio create its profile dirs, then kill it; the MCP flag
          # is seeded after, so first-run setup can't wipe it.
          if [ -d "/Applications/RobloxStudio.app" ]; then
            open "/Applications/RobloxStudio.app"
          else
            open -a "Roblox Studio"
          fi
          sleep 30
          pkill -x RobloxStudio || true

      - name: Seed MCP enabled flag (macOS)
        if: steps.check.outputs.has_secret == 'true' && runner.os == 'macOS'
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
        run: |
          # Resolve the account's user ID from the cookie, then write the
          # Assistant plugin setting so Studio starts with MCP enabled.
          # (macOS data dir mirrors Windows %LOCALAPPDATA%\Roblox.)
          set -euo pipefail
          user_id="$(curl -s --fail -H "Cookie: .ROBLOSECURITY=${ROBLOSECURITY}" https://users.roblox.com/v1/users/authenticated | grep -o '"id":[0-9]*' | head -n 1 | grep -o '[0-9]*')"
          if [ -z "$user_id" ]; then echo "Could not resolve user ID from ROBLOSECURITY"; exit 1; fi
          dir="$HOME/Library/Roblox/$user_id/InstalledPlugins/0"
          mkdir -p "$dir"
          printf '{ "Assistant-ExternalMCPEnabled":true }' > "$dir/settings.json"

      - name: Log in and launch Studio (macOS)
        if: steps.check.outputs.has_secret == 'true' && runner.os == 'macOS'
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
        run: |
          # Best-effort legacy plist cookie seeding (Studio also picks up
          # HTTPStorages sessions when the account is already logged in).
          defaults write com.roblox.RobloxStudioBrowser "roblox.com.ROBLOSECURITY" -string "COOK::<${ROBLOSECURITY}>"
          defaults read com.roblox.RobloxStudioBrowser "roblox.com.ROBLOSECURITY" > /dev/null || echo "WARNING: cookie not readable back"
          # Open this place in edit mode (minimized protocol URL; the CI
          # account needs edit access to it, or swap in your own IDs).
          args="roblox-studio:1+launchmode:edit+task:EditPlace+placeId:95206881+universeId:28220420"
          # Fresh instance: macOS ignores --args for an already-running app.
          pkill -x RobloxStudio || true
          sleep 2
          if [ -d "/Applications/RobloxStudio.app" ]; then
            open "/Applications/RobloxStudio.app" --args "$args"
          else
            open -a "Roblox Studio" --args "$args"
          fi

      - name: Diagnose Studio (Windows)
        if: steps.check.outputs.has_secret == 'true' && runner.os == 'Windows'
        run: |
          Write-Host "--- Studio processes ---"
          Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue | Select-Object Id,MainWindowTitle | Format-Table -AutoSize | Out-String -Width 200
          Write-Host "--- mcp.bat ---"
          Get-Content "$env:LOCALAPPDATA\Roblox\mcp.bat" -ErrorAction SilentlyContinue
          Write-Host "--- plugin settings files ---"
          Get-ChildItem "$env:LOCALAPPDATA\Roblox\*\InstalledPlugins\0\settings.json" -ErrorAction SilentlyContinue | Select-Object FullName
          # Let pending log output flush before grepping.
          Start-Sleep -Seconds 5
          Write-Host "--- Studio logs mentioning place 95206881 ---"
          $logs = Get-ChildItem "$env:LOCALAPPDATA\Roblox\logs" -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 3
          if (-not $logs) { Write-Host "WARNING: no Studio logs found" }
          foreach ($log in $logs) {
            Write-Host "== $($log.Name) =="
            $hits = Select-String -Path $log.FullName -Pattern "95206881" -ErrorAction SilentlyContinue | Select-Object -First 5
            if ($hits) { $hits } else { Write-Host "(no match)" }
          }

      - name: Diagnose Studio (macOS)
        if: steps.check.outputs.has_secret == 'true' && runner.os == 'macOS'
        run: |
          echo "--- Studio processes ---"
          pgrep -fl "RobloxStudio" || echo "WARNING: no Studio process running"
          echo "--- Installed apps ---"
          ls -d /Applications/*Roblox* /Applications/*roblox* 2>/dev/null || echo "WARNING: no Roblox app in /Applications"
          echo "--- MCP flag ---"
          defaults read com.roblox.RobloxStudioBrowser "roblox.com.ROBLOSECURITY" > /dev/null 2>&1 && echo "cookie stored" || echo "WARNING: cookie not readable back"
          find "$HOME/Library/Roblox" -name "settings.json" -path "*InstalledPlugins*" 2>/dev/null || echo "WARNING: no plugin settings file found"
          # Let pending log output flush before grepping.
          sleep 5
          echo "--- Studio logs mentioning place 95206881 ---"
          if [ -d "$HOME/Library/Logs/Roblox" ]; then
            ls -t "$HOME/Library/Logs/Roblox" 2>/dev/null | head -n 3 | while read -r f; do
              echo "== $f =="
              grep -m 5 "95206881" "$HOME/Library/Logs/Roblox/$f" || echo "(no match)"
            done
          else
            echo "WARNING: no Studio logs dir"
          fi

      - name: Wait for Studio MCP
        if: steps.check.outputs.has_secret == 'true'
        working-directory: python
        timeout-minutes: 5
        run: python -m examples.wait_for_studio 60

      - name: Python integration tests (live Studio)
        if: steps.check.outputs.has_secret == 'true'
        working-directory: python
        timeout-minutes: 5
        env:
          ROBLOX_STUDIO_MCP_INTEGRATION: "1"
        run: python -m pytest tests

  node-studio:
    name: Node + Studio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    environment: ROBLOSECURITY
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
