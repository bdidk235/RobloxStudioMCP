# macOS MCP attach, attempt 5 - diagnosis rather than another verdict.
#
# Attempt 4 result, measured: install ok, cookie ok, flag written, process alive,
# and then `wait_for_studio 180` timed out. So the cookie fix works - the stage
# the 2026-09-14 job died on now passes - and the failure has moved past it.
#
# "Not attached" is not a diagnosis. Three candidate causes, and they are not
# distinguishable from the outside:
#
#   a  Assistant-ExternalMCPEnabled was written somewhere Studio never reads, so
#      the MCP server is off. The path is a guess inherited from the Windows
#      layout; nothing has ever confirmed it on a Mac.
#   b  Studio is not signed in. The cookie is accepted by the Roblox API, which
#      is a different reader from the one Studio uses.
#   c  The MCP proxy is missing or not started on macOS.
#
# This attempt answers which, from Studio's own log, rather than by guessing a
# fourth time. Log output is grepped and capped - a Studio log runs to megabytes
# and printing it whole has wedged tooling in this project before.

name: macOS MCP diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: macos-latest
    runs-on: macos-latest
    environment: ROBLOSECURITY
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Studio
        shell: bash
        run: |
          set -uo pipefail
          dmg=/tmp/rbx-studio.dmg
          curl -sS -L --fail --retry 3 -o "$dmg" "https://setup.rbxcdn.com/mac/RobloxStudio.dmg"
          mnt=/tmp/rbx-studio-mnt
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mnt"
          app="$(find "$mnt" -maxdepth 1 -name '*.app' -type d -print -quit)"
          cp -R "$app" /Applications/
          STUDIO_APP="/Applications/$(basename "$app")"
          xattr -dr com.apple.quarantine "$STUDIO_APP" 2>/dev/null || true
          hdiutil detach "$mnt" || true
          rm -f "$dmg"
          echo "STUDIO_APP=$STUDIO_APP" >> "$GITHUB_ENV"

      - name: Seed cookie, flag, and record what exists
        id: seed
        shell: bash
        env:
          COOKIE: ${{ secrets.ROBLOSECURITY }}
        run: |
          set -uo pipefail
          report() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          echo "::add-mask::$COOKIE"

          user_id="$(curl -sS --fail -H "Cookie: .ROBLOSECURITY=$COOKIE" \
            https://users.roblox.com/v1/users/authenticated \
            | grep -o '"id":[0-9]*' | head -n1 | grep -o '[0-9]*')"
          report user_id "$user_id"
          echo "USER_ID=$user_id" >> "$GITHUB_ENV"

          python -m pip install -q binarycookies
          python - "$HOME/Library/HTTPStorages/com.Roblox.RobloxStudio.binarycookies" <<'PY'
          import datetime, os, sys
          import binarycookies
          path = sys.argv[1]
          now = datetime.datetime.now(datetime.timezone.utc)
          entry = {"name": ".ROBLOSECURITY", "value": os.environ["COOKIE"],
                   "url": "https://roblox.com", "path": "/",
                   "create_datetime": now.isoformat(),
                   "expiry_datetime": (now + datetime.timedelta(days=3650)).isoformat(),
                   "flag": "Secure; HttpOnly"}
          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, "wb") as h:
              binarycookies.dump(entry, h)
          with open(path, "rb") as h:
              names = [c.name for c in binarycookies.load(h)]
          assert ".ROBLOSECURITY" in names, names
          print("cookie read back OK:", names)
          PY
          defaults write com.roblox.RobloxStudioBrowser "roblox.com.ROBLOSECURITY" \
            -string "COOK::<${COOKIE}>" 2>/dev/null || true

          # Every plausible location, each reported, so a later reader can tell
          # which of them exists on a real Mac rather than which one was guessed.
          for dir in \
            "$HOME/Library/Roblox/$USER_ID/InstalledPlugins/0" \
            "$HOME/Library/Application Support/Roblox/RobloxStudio/InstalledPlugins/0" \
            "$HOME/Library/Application Support/Roblox/$USER_ID/InstalledPlugins/0" \
            "$HOME/Library/Application Support/Roblox/RobloxStudio/InstalledPlugins" ; do
            if mkdir -p "$dir" 2>/dev/null; then
              printf '{ "Assistant-ExternalMCPEnabled":true }' > "$dir/settings.json"
            fi
          done
          # What actually exists under the Roblox trees, so the guess can be
          # replaced with a measurement next time.
          {
            echo "roblox_tree:"
            find "$HOME/Library" -maxdepth 4 -iname '*Roblox*' -type d 2>/dev/null | head -20
            echo "installed_plugins:"
            find "$HOME/Library" -maxdepth 6 -path '*InstalledPlugins*' 2>/dev/null | head -20
            echo "mcp_proxy_in_app:"
            ls -1 "$STUDIO_APP/Contents/MacOS" 2>/dev/null | head -20
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Launch and read Studio's own log
        id: diag
        shell: bash
        run: |
          set -uo pipefail
          report() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          pkill -x RobloxStudio 2>/dev/null || true
          sleep 2
          open "$STUDIO_APP"

          alive=0
          for _ in $(seq 1 45); do
            if pgrep -x RobloxStudio >/dev/null 2>&1; then alive=1; break; fi
            sleep 2
          done
          report alive "$alive"
          [ "$alive" = "1" ] || { report outcome process-never-started; exit 1; }
          sleep 25

          logdir="$HOME/Library/Logs/Roblox"
          report log_dir_exists "$([ -d "$logdir" ] && echo yes || echo no)"
          report log_files "$(ls -1 "$logdir" 2>/dev/null | wc -l | tr -d ' ')"
          newest="$(ls -t "$logdir" 2>/dev/null | head -n1)"
          report newest_log "$newest"
          report outcome launched

          # The diagnosis. Grepped and capped: this is the difference between
          # "not attached" and a cause, and it is the whole point of the attempt.
          if [ -n "$newest" ] && [ -f "$logdir/$newest" ]; then
            log="$logdir/$newest"
            {
              echo "### Studio log: MCP / Assistant / auth signals"
              echo ""
              echo "log: \`$newest\` ($(wc -l < "$log" | tr -d ' ') lines)"
              echo ""
              echo "#### MCP / Assistant / ExternalMCP (up to 30)"
              echo '```'
              grep -iE 'mcp|assistant|externalmcp' "$log" | head -30 || echo "(no match)"
              echo '```'
              echo ""
              echo "#### sign-in (up to 15)"
              echo '```'
              grep -iE 'login|logged in|authenticat|ROBLOSECURITY' "$log" | head -15 || echo "(no match)"
              echo '```'
              echo ""
              echo "#### mesh / server listen (up to 15)"
              echo '```'
              grep -iE '13469|listening|websocket|port' "$log" | head -15 || echo "(no match)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Also to stdout, filtered, so `gh run view --log` is enough to read it.
            echo "--- MCP/Assistant ---"
            grep -iE 'mcp|assistant|externalmcp' "$log" | head -30 || echo "(no match)"
            echo "--- sign-in ---"
            grep -iE 'login|logged in|authenticat' "$log" | head -15 || echo "(no match)"
          fi

      - name: Try the mesh once, and keep the error
        id: mesh
        shell: bash
        run: |
          set -uo pipefail
          cd python
          pip install -q -e ".[dev]" 2>&1 | tail -1
          # Short, and the error is captured rather than swallowed: attempt 4
          # timed out for 180s and the only thing printed was "still waiting".
          if python -m examples.wait_for_studio 45; then
            echo "outcome=attached" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=not-attached" >> "$GITHUB_OUTPUT"
            exit 1
          fi
