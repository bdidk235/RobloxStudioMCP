# Studio install smoke test.
#
# Manual, and deliberately separate from ci.yml. The 2026-09-14 attempt at
# live-Studio CI spent 13 commits and 8 failing runs and never established the
# most basic question: does Studio even *run* on a CI runner? Its Windows install
# step asserted that RobloxStudioBeta.exe and StudioMCP.exe existed, the single-file
# zip satisfies both, and the diagnose step then found no process, no profile and
# no logs. File existence was reported as a successful install.
#
# So this asks exactly one question, with no MCP, so that a failure is
# unambiguous:
#
#     does a Studio process actually come up on this runner?
#
# Asserted on a RUNNING PROCESS, never on a file.
#
# MEASURED, in order, 2026-10-01:
#
#   attempt 1  macOS  OK   alive=1, outcome=running
#             win    FAIL  "No such host is known" from Invoke-WebRequest
#
#   attempt 2  macOS  OK   alive=1, outcome=running
#             win    FAIL  bootstrapper downloads 200 / 7.6 MB, then does nothing:
#                           after a full 120s poll alive=0, versions_dir_exists
#                           False, versions_entries 0, log_files 0. Not one byte
#                           written under %LOCALAPPDATA%\Roblox.
#                           => the bootstrapper is a GUI installer and will not
#                              run headless.
#
#   attempt 3  win    the community installer, which drives the same download
#                   headlessly and seeds the credential stores. Its repository
#                   runs a workflow every 12 hours to check it still works
#                   against the current installer, which is the property that
#                   matters. This is the route commit 0f87c48 chose on
#                   2026-09-14; that run was CANCELLED, so it never got a
#                   verdict and the escalation moved on to a route that could
#                   not work. First actual evaluation, 2026-10-01.
#
# Fold the working version into ci.yml once both platforms are green here.

name: Studio install smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Required for the environment secret the Windows installer authenticates with.
    environment: ROBLOSECURITY
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------- macOS
      - name: Install and launch Studio (macOS)
        if: runner.os == 'macOS'
        id: mac
        shell: bash
        run: |
          set -uo pipefail
          report() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1: $2"; }

          dmg="/tmp/rbx-studio.dmg"
          if ! curl -sS -L --fail --retry 3 -o "$dmg" \
               "https://setup.rbxcdn.com/mac/RobloxStudio.dmg"; then
            report outcome "download-failed"
            exit 1
          fi
          report dmg_mb "$(du -m "$dmg" | cut -f1)"

          mnt="/tmp/rbx-studio-mnt"
          # `|| true` on detach: cleanup must not mask the real verdict.
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mnt" || {
            report outcome "mount-failed"; exit 1; }
          app="$(find "$mnt" -maxdepth 1 -name '*.app' -type d -print -quit)"
          if [ -z "$app" ]; then
            report outcome "no-app-in-dmg"
            hdiutil detach "$mnt" || true
            exit 1
          fi
          report app_in_dmg "$(basename "$app")"

          # Copy rather than run from the mount: a read-only volume cannot host
          # the profile Studio writes on first run, which is a plausible reason a
          # launch from the dmg produced no profile and no logs.
          cp -R "$app" /Applications/
          installed="/Applications/$(basename "$app")"
          xattr -dr com.apple.quarantine "$installed" 2>/dev/null || true
          hdiutil detach "$mnt" || true
          rm -f "$dmg"

          # Launch with no place. A Studio with no document reports name: null on
          # the mesh, which is fine - the only question here is whether the
          # process comes up at all.
          open "$installed"
          alive=0
          for _ in $(seq 1 30); do
            if pgrep -x RobloxStudio >/dev/null 2>&1; then alive=1; break; fi
            sleep 2
          done

          report alive "$alive"
          report process_count "$(pgrep -x RobloxStudio | wc -l | tr -d ' ')"
          # A process can be alive and still useless, and these distinguish that
          # from a Studio that is genuinely up.
          report profile_dirs "$(find "$HOME/Library/Roblox" -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')"
          report log_files "$(ls -1 "$HOME/Library/Logs/Roblox" 2>/dev/null | wc -l | tr -d ' ')"
          report log_dir_exists "$([ -d "$HOME/Library/Logs/Roblox" ] && echo yes || echo no)"

          # Name only, never contents: a log can be megabytes.
          if [ -d "$HOME/Library/Logs/Roblox" ]; then
            report newest_log "$(ls -t "$HOME/Library/Logs/Roblox" 2>/dev/null | head -n1)"
          fi

          if [ "$alive" != "1" ]; then
            report outcome "process-never-started"
            exit 1
          fi
          report outcome "running"

      # -------------------------------------------------------------- Windows
      - name: Install Studio via the community installer (Windows)
        if: runner.os == 'Windows'
        uses: OrbitalOwen/roblox-win-installer-action@1.1
        with:
          cookie: ${{ secrets.ROBLOSECURITY }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify a Studio process is actually running (Windows)
        if: runner.os == 'Windows'
        id: win
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Report($k, $v) {
            "$k=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "$k : $v"
          }

          $exe = $null
          for ($i = 0; $i -lt 30; $i++) {
            $p = Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue |
                 Select-Object -First 1
            if ($p) { $exe = $p; break }
            Start-Sleep -Seconds 2
          }

          # What the installer left, reported either way. A failure that says
          # what exists is worth ten that say only "it failed".
          Report versions_dir_exists (Test-Path "$env:LOCALAPPDATA\Roblox\Versions")
          Report versions_entries (@(Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions" -Directory -ErrorAction SilentlyContinue).Count)
          Report log_files (@(Get-ChildItem "$env:LOCALAPPDATA\Roblox\logs" -File -ErrorAction SilentlyContinue).Count)
          Report mcp_proxy_exists (Test-Path "$env:LOCALAPPDATA\Roblox\mcp.bat")
          $proxy = Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions" -Directory -ErrorAction SilentlyContinue |
                   ForEach-Object { Join-Path $_.FullName 'StudioMCP.exe' } |
                   Where-Object { Test-Path $_ } | Select-Object -First 1
          Report studiomcp_exe ([bool]$proxy)

          if (-not $exe) {
            Report alive 0
            Report roblox_dir ((@(Get-ChildItem "$env:LOCALAPPDATA\Roblox" -ErrorAction SilentlyContinue |
                                 Select-Object -ExpandProperty Name) -join ','))
            Report outcome 'process-never-started'
            exit 1
          }

          Report alive 1
          Report exe_path $exe.Path
          $log = Get-ChildItem "$env:LOCALAPPDATA\Roblox\logs" -File -ErrorAction SilentlyContinue |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($log) { Report newest_log $log.Name }
          Report outcome 'running'

      - name: Verdict
        if: always()
        shell: bash
        run: |
          outcome="${{ steps.mac.outputs.outcome || steps.win.outputs.outcome }}"
          {
            echo "### Studio install smoke - ${{ matrix.os }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| outcome | \`$outcome\` |"
            echo "| alive | \`${{ steps.mac.outputs.alive || steps.win.outputs.alive }}\` |"
            echo "| log files | \`${{ steps.mac.outputs.log_files || steps.win.outputs.log_files }}\` |"
            echo "| newest log | \`${{ steps.mac.outputs.newest_log || steps.win.outputs.newest_log }}\` |"
            echo "| mcp proxy | \`${{ steps.win.outputs.mcp_proxy_exists }}\` |"
            echo "| StudioMCP.exe | \`${{ steps.win.outputs.studiomcp_exe }}\` |"
            echo ""
            if [ "$outcome" = "running" ]; then
              echo "A Studio process came up. Install is viable on this runner, so the"
              echo "next question is authentication and MCP attach, not installation."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
