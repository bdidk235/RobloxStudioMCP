# What is actually inside the macOS Studio download?
#
# Read-only structural inspection. No launch, no sign-in, no place, no auth.
# This exists to answer one question with evidence rather than inference:
#
#   is the macOS Studio bundle structurally modifiable at all?
#
# That is the precondition for every offline / patch / inject idea. If the DMG
# ships only an installer stub, if the bundle is sealed with a hardened-runtime
# signature, or if `disable-library-validation` is absent, then the technique
# studio-offline uses on Windows has no macOS equivalent here and no amount of
# reverse engineering changes that. Measured beats argued.
#
# studio-offline works on Windows by replacing WebView2Loader.dll, which is a
# Windows-only component. The macOS questions this answers are therefore:
#   1. does the DMG contain the real engine, or only a stub that downloads it?
#   2. if the real app, is it a signed bundle with the hardened runtime on?
#   3. does it allow a foreign library to be loaded (disable-library-validation)?
#   4. is the Mach-O linkage intact - every @rpath actually resolving?
#   5. is there a WebKit / WebView analogue, or is the auth web layer native?
#
# Everything is capped. `strings` over a multi-hundred-MB binary is the one
# place that can produce bulk output, so it is filtered to a fixed pattern and a
# fixed count.
#
# ON `set +e` IN THE REPORT STEPS, which is not a style choice:
#
#   `shell: bash` runs as `/bin/bash --noprofile --norc -e -o pipefail {0}`.
#   The `-e` is already there. Writing `set -uo pipefail` ADDS to it, it does not
#   replace it, so errexit is live whether or not this file mentions it.
#
#   That killed the first run of this workflow in under a second. Inside the
#   report block, `strings … | grep -Eo …` returns 1 when it matches nothing —
#   which is a perfectly good answer — and errexit aborted the step right there,
#   discarding every probe that had already run. The step summary looked fine
#   because all of its output was redirected; the log showed nothing at all
#   except "exit code 1", which is the least informative possible failure.
#
#   So the reporting steps turn errexit off deliberately and say so. A probe that
#   finds nothing is data, not failure. What is *not* tolerated is a probe that
#   cannot run: each one reports its own inability rather than being skipped.

name: Studio bundle probe (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download the DMG (no launch)
        id: dl
        shell: bash
        run: |
          set -uo pipefail
          report() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          dmg=/tmp/studio.dmg
          code="$(curl -sS -L --retry 3 -o "$dmg" -w '%{http_code}' \
            https://setup.rbxcdn.com/mac/RobloxStudio.dmg)"
          report http_code "$code"
          [ "$code" = "200" ] || { report outcome download-failed; exit 0; }
          # Bytes, not megabytes. The MB conversion was `awk "BEGIN{printf
          # \"%.1f\", $n/1048576}"`, and the shell strips the inner quotes so awk
          # receives `printf %.1f` and dies with a syntax error - reported as
          # noise in a step that otherwise succeeded. No arithmetic, no quoting.
          report dmg_bytes "$(wc -c < "$dmg" | tr -d ' ')"
          # The DMG is mounted for reading and never opened. `open` on this image
          # is what launches the installer, which is exactly what this workflow
          # must not do.
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint /tmp/mnt \
            || { report outcome mount-failed; exit 0; }
          report mounted_entries "$(ls -1 /tmp/mnt 2>/dev/null | wc -l | tr -d ' ')"
          report outcome downloaded

      - name: What is in the image
        if: steps.dl.outputs.outcome == 'downloaded'
        shell: bash
        run: |
          set -uo pipefail
          set +e   # see the header: `shell: bash` already implies -e, and a probe
                   # that finds nothing must not abort the report.
          {
            echo "### Bundles in the DMG"
            echo '```'
            find /tmp/mnt -maxdepth 2 -name '*.app' -type d
            echo '```'
            echo
            echo "### Top-level layout (depth 3, capped)"
            echo '```'
            find /tmp/mnt -maxdepth 3 2>/dev/null | head -40
            echo '```'
            app="$(find /tmp/mnt -maxdepth 2 -name '*.app' -type d -print -quit 2>/dev/null)"
            if [ -z "$app" ]; then
              echo
              echo "**No .app in the image at all.**"
              exit 0
            fi
            echo "APP=$app" >> "$GITHUB_ENV"
            echo
            echo "### Size of what shipped"
            echo '```'
            du -sh "$app" 2>/dev/null || echo "(du failed)"
            echo "files: $(find "$app" -type f 2>/dev/null | wc -l | tr -d ' ')"
            echo '```'
            echo
            echo "### The decisive question: stub or engine?"
            echo '```'
            # A stub is a few MB and carries no engine payload. If the whole
            # bundle is small, the real Studio is downloaded at run time and
            # cannot be inspected from the DMG at all - which is itself the
            # answer, and the reason the download URL below matters.
            echo "largest files:"
            find "$app" -type f -size +5M -exec ls -lh {} + 2>/dev/null | head -5
            big="$(find "$app" -type f -size +20M -print -quit 2>/dev/null)"
            if [ -z "$big" ]; then
              echo "-> no file over 20 MB: this is a stub, not the engine"
            else
              echo "-> engine-scale payload present"
            fi
            echo '```'
            echo
            echo "### Where does it say the real app comes from?"
            echo '```'
            # If the payload is fetched, the URL is in the stub binary. Finding it
            # is the only way to get the real .app without running the installer.
            bin="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -print -quit 2>/dev/null)"
            if [ -n "$bin" ]; then
              urls="$(strings -a "$bin" 2>/dev/null \
                | grep -Eo 'https://[A-Za-z0-9._/-]+' \
                | grep -iE 'zip|setup|installer|client|app' \
                | sort -u | head -12)"
              if [ -n "$urls" ]; then printf '%s\n' "$urls"
              else echo "(no download URL found in the stub binary)"; fi
            else
              echo "(no executable in Contents/MacOS)"
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Bundle identity, linkage and signature
        if: steps.dl.outputs.outcome == 'downloaded'
        shell: bash
        run: |
          set -uo pipefail
          set +e   # see the header
          # Guarded in the script, not only in the step's `if:`.
          app="${APP:-}"
          if [ -z "$app" ] || [ ! -d "$app" ]; then
            echo "no app bundle was recorded by the previous step; nothing to inspect" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          contents="$app/Contents"
          # The main executable, named by Info.plist - NOT the first file `find`
          # returns. That mistake was made and then caught: `find -print -quit`
          # handed back libmimalloc.3.dylib because it sorts first, so the
          # architecture and linkage sections described a bundled library rather
          # than the program. CFBundleExecutable is the field that means it.
          exec_name="$(plutil -extract CFBundleExecutable raw -o - \
            "$contents/Info.plist" 2>/dev/null)"
          bin=""
          if [ -n "$exec_name" ] && [ -f "$contents/MacOS/$exec_name" ]; then
            bin="$contents/MacOS/$exec_name"
          else
            bin="$(find "$contents/MacOS" -maxdepth 1 -type f -print -quit 2>/dev/null)"
            echo "NOTE: CFBundleExecutable unusable ('${exec_name:-unset}'), fell back to $bin" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "### Identity"
            echo '```'
            for k in CFBundleIdentifier CFBundleExecutable CFBundleShortVersionString \
                     CFBundleVersion LSMinimumSystemVersion; do
              v="$(plutil -extract "$k" raw -o - "$contents/Info.plist" 2>/dev/null)"
              printf '%-28s %s\n' "$k" "${v:--}"
            done
            echo '```'
            if [ -z "$bin" ]; then
              echo; echo "**No executable in Contents/MacOS, so no linkage to check.**"
              exit 0
            fi
            echo
            echo "### Architecture"
            echo '```'
            file "$bin" 2>/dev/null || echo "(file failed)"
            lipo -archs "$bin" 2>/dev/null || echo '(universal)'
            echo '```'
            echo
            echo "### Signature — the hardened runtime is the whole question"
            echo '```'
            codesign -d --verbose=4 "$app" 2>&1 | head -20
            echo
            echo "verify --deep --strict:"
            codesign --verify --deep --strict --verbose=2 "$app" 2>&1 | head -5 \
              || echo "(verification reported a problem, or the tool was refused)"
            echo '```'
            echo
            echo "### Entitlements — \`disable-library-validation\` decides whether a"
            echo "### foreign dylib can ever be loaded into this process"
            echo '```'
            ent="$(codesign -d --entitlements - --xml "$app" 2>&1 | tr -d '\0')"
            found="$(printf '%s' "$ent" | grep -Eo '(allow-unsigned-executable-memory|disable-library-validation|get-task-allow|cs-debugger|app-sandbox)' | sort -u)"
            if [ -n "$found" ]; then printf '%s\n' "$found"
            else echo "(none of those entitlements are present)"; fi
            echo '```'
            echo
            echo "### Mach-O linkage — is anything unresolved?"
            echo '```'
            echo "-- LC_RPATH entries (deduplicated) --"
            # `otool` prints one load-command set per architecture, so a
            # universal binary reports every rpath twice. `sort -u` because a
            # doubled list reads as two distinct search paths, which is not what
            # the binary actually says.
            rpaths="$(otool -l "$bin" 2>/dev/null | grep -A2 LC_RPATH \
              | grep 'path ' | sed 's/^ *//' | sort -u)"
            if [ -n "$rpaths" ]; then printf '%s\n' "$rpaths"; else echo '(none)'; fi
            echo
            echo "-- non-system dependencies, existence checked --"
            # `loader` is the directory of the executable, which is what
            # @loader_path actually means. Hardcoding Contents/MacOS would be
            # right for today's layout and silently wrong the day the binary
            # moves - the same "assume a path nobody checked" mistake this whole
            # investigation is about.
            loader="$(cd "$(dirname "$bin")" 2>/dev/null && pwd)"
            miss=0
            while read -r dep; do
              case "$dep" in
                /usr/lib/*|/System/*) continue ;;
              esac
              case "$dep" in
                @loader_path/*) real="$loader/${dep#@loader_path/}" ;;
                @executable_path/*) real="$loader/${dep#@executable_path/}" ;;
                @rpath/*) real="(rpath-unresolved) ${dep#@rpath/}" ;;
                /*) real="$dep" ;;
                *) real="(bare) $dep" ;;
              esac
              if [ -e "$real" ]; then
                printf 'ok      %s\n' "$dep"
              else
                printf 'MISSING %s   -> looked in %s\n' "$dep" "$real"
                miss=$((miss+1))
              fi
            # `sort -u` on the dependency list for the same reason: otool prints
            # one slice per architecture, so a universal binary lists every
            # dependency twice and the count doubles. The earlier run reported
            # "missing: 2" for a single unresolvable dylib, which reads as two
            # separate problems when it is one.
            done < <(otool -L "$bin" 2>/dev/null | tail -n +2 | awk '{print $1}' | sort -u)
            echo "missing: $miss"
            echo '```'
            echo
            echo "### Is there a WebKit / WebView analogue to hook?"
            echo '```'
            echo "-- linked frameworks matching webview/webkit --"
            wl="$(otool -L "$bin" 2>/dev/null | grep -iE 'webview|webkit|electron')"
            if [ -n "$wl" ]; then printf '%s\n' "$wl"; else echo '(none)'; fi
            echo "-- WebKit inside the bundle --"
            inb="$(find "$contents" -maxdepth 3 \( -iname '*WebKit*' -o -iname '*WebView*' \) 2>/dev/null | head -8)"
            if [ -n "$inb" ]; then printf '%s\n' "$inb"; else echo '(no bundled web runtime)'; fi
            echo "-- does the binary contain the exact string studio-offline hooks? --"
            n="$(strings -a "$bin" 2>/dev/null | grep -ciE 'WebView2|CreateCoreWebView2')"
            echo "matches: ${n:-0}"
            echo "  0 means the string studio-offline intercepts on Windows does not"
            echo "  exist in this binary at all - the concrete reason its technique"
            echo "  has no macOS equivalent, rather than an inference from the docs."
            echo '```'
            echo
            echo "### Symlinks — do they resolve?"
            echo '```'
            n=0
            while read -r l; do
              [ "$n" -ge 10 ] && break
              tgt="$(readlink "$l" 2>/dev/null)"
              if [ -e "$l" ]; then st="ok     "; else st="BROKEN "; fi
              printf '%s %s -> %s\n' "$st" "${l#$app/}" "${tgt:-?}"
              n=$((n+1))
            done < <(find "$app" -type l 2>/dev/null | head -12)
            [ "$n" -eq 0 ] && echo '(no symlinks)'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
